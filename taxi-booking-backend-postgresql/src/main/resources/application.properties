spring.application.name=taxi-booking-backend
server.port=8080

# PostgreSQL database
# Defaults to a local PostgreSQL 15/16 installation with database "app".
# Override DB_URL, DB_USERNAME and DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Frontend origin allowed for CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}
